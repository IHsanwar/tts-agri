services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TTS_DATABASE_URL=sqlite+aiosqlite:////data/tts.sqlite
      - TTS_APP_ORIGIN=https://${DOMAIN:-localhost}
      - TTS_COOKIE_SECURE=true
      - TTS_INVITE_CODE=${INVITE_CODE:-change-me-invite-code}
    volumes:
      - ./data:/data
      - ./backups:/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
