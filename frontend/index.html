<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,500;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <title>TTS Arena — English Crossword Arena</title>

    <!--
      Resolve the theme BEFORE first paint to avoid a flash of the wrong theme.
      Effective theme lands on <html data-theme>, which index.css keys off.
      src/lib/theme.ts reads this same attribute, and keeps the two in sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tts_theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var effective =
            mode === 'system'
              ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : mode;
          document.documentElement.setAttribute('data-theme', effective);
        } catch (e) {
          // localStorage/matchMedia unavailable — fall back to light.
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body class="bg-paper-100 text-ink-900 font-sans antialiased min-h-screen selection:bg-newspaper-yellow selection:text-ink-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
